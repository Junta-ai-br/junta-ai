name: Deploy React frontend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - frontend-v2/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: juntai-frontend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: junta-ai-br/juntai-nginx-react-frontend
  CONTAINER_APP_NAME: juntai-nginx-react-frontend
  RESOURCE_GROUP: JuntaI-BackEnd

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend-v2
          file: frontend-v2/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Export immutable image reference
        id: image
        run: echo "reference=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy image to Azure
    needs: build
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Skip deployment until Azure and GHCR credentials are configured
        if: ${{ env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_SUBSCRIPTION_ID == '' || env.GHCR_USERNAME == '' || env.GHCR_TOKEN == '' }}
        run: echo "Azure OpenID Connect or GitHub Container Registry credentials are not configured yet. The image was published, but deployment was skipped."

      - name: Sign in to Azure with OpenID Connect
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.GHCR_USERNAME != '' && env.GHCR_TOKEN != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure GHCR and deploy the new image
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.GHCR_USERNAME != '' && env.GHCR_TOKEN != '' }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp registry set \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --server "${{ env.REGISTRY }}" \
              --username "${{ env.GHCR_USERNAME }}" \
              --password "${{ env.GHCR_TOKEN }}"

            az containerapp update \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ needs.build.outputs.image }}"
