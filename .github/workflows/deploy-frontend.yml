name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - frontend-v2/**
      - .github/workflows/deploy-frontend.yml
  push:
    branches: [main]
    paths:
      - frontend-v2/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend-v2

# Production deployment is managed by the GitHub integration with Vercel.
jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        # Bound concurrency without excluding tests or increasing timeouts.
        run: npm run test:run -- --maxWorkers=2

      - name: Build frontend
        run: npm run build
